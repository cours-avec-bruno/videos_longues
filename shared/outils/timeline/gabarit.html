<title>Timeline de « Quelle aurait dû être ta vie ? »</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Une seule rangée de scènes qu'on fait défiler de gauche à droite, comme la vidéo.
   Pour chaque scène : ce qu'on voit, et ce que dit la voix. Rien d'autre. */
:root {
  --bg: #eef0f2; --card: #ffffff; --ink: #1a1d21; --muted: #646c75; --line: #d9dde1;
  --accent: #b06c18; --accent-soft: #f4e6d2; --done: #3f8657;
  --f-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121519; --card: #1a1e23; --ink: #e8eaed; --muted: #9aa2ab; --line: #2b3138;
  --accent: #e0993f; --accent-soft: #33271a; --done: #62b37c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121519; --card: #1a1e23; --ink: #e8eaed; --muted: #9aa2ab; --line: #2b3138;
  --accent: #e0993f; --accent-soft: #33271a; --done: #62b37c; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.wrap { padding-block: 36px 18px; display: grid; gap: 10px; }
h1 { font: 500 clamp(30px, 4.4vw, 44px)/1.08 var(--f-serif); margin: 0; text-wrap: balance; }
.status { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); }
.status b { color: var(--ink); font-weight: 500; }
.status .now b { color: var(--accent); }
.note { color: var(--muted); font: italic 16px/1.5 var(--f-serif); margin: 0; max-width: 62ch; }

.strip { display: flex; gap: 3px; height: 30px; align-items: stretch; margin-block: 8px 4px; }
.strip button { flex-basis: 0; min-width: 0; border: 0; padding: 0; border-radius: 3px; background: var(--line); cursor: pointer; position: relative; font: 500 10px var(--f-sans); color: transparent; }
.strip button.done { background: color-mix(in srgb, var(--done) 55%, var(--line)); }
.strip button.now { background: var(--accent); }
.strip button.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.strip button:hover, .strip button:focus-visible { color: var(--ink); background: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.strip-legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.rowhead { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-block: 20px 10px; }
.nav { font: 500 14px var(--f-sans); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; }
.nav:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.row { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-block: 2px 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scroll-padding-left: max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 1212px) { .row { padding-left: calc((100% - 1148px) / 2); scroll-padding-left: calc((100% - 1148px) / 2); } }
.scene { flex: 0 0 min(360px, 86vw); scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; display: grid; gap: 14px; align-content: start; }
.scene.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.state { display: inline-flex; align-items: center; gap: 6px; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.state.done::before { background: var(--done); }
.state.now { color: var(--accent); }
.state.now::before { background: var(--accent); }
.scene h2 { font: 500 23px/1.2 var(--f-serif); margin: 0; text-wrap: balance; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.screen p { margin: 0; }
.voice { border-top: 1px solid var(--line); padding-top: 12px; }
.voice p { margin: 0 0 8px; font: 17px/1.5 var(--f-serif); }
.voice p:last-child { margin-bottom: 0; }
.voice .none { font-style: italic; color: var(--muted); font-size: 15px; }
footer.wrap { padding-block: 6px 40px; color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: no-preference) { .row { scroll-behavior: smooth; } }
</style>

<header class="wrap">
  <h1 id="titre">Quelle aurait dû être ta vie ?</h1>
  <div class="status" id="status"></div>
  <p class="note" id="note"></p>
  <div class="strip" id="strip" aria-label="Les scènes dans l'ordre, à l'échelle de leur durée"></div>
  <div class="strip-legend"><span>00:00</span><span id="fin"></span></div>
</header>

<div class="wrap rowhead">
  <button class="nav" id="prev" type="button" aria-label="Scène précédente">←</button>
  <button class="nav" id="next" type="button" aria-label="Scène suivante">→</button>
</div>
<div class="row" id="row" aria-label="Les scènes"></div>

<footer class="wrap" id="foot"></footer>

<script id="donnees" type="application/json">/*__DONNEES__*/null</script>
<script>
(function () {
  "use strict";
  var D = null;
  try { D = JSON.parse(document.getElementById("donnees").textContent); } catch (e) {}
  if (!D) { document.getElementById("row").textContent = "Page à générer avec shared/outils/timeline/generer.py."; return; }
  var S = D.scenes, suivi = D.suivi, ecran = suivi.ecran || {};
  var cur = suivi.en_cours, nxt = suivi.prochaine;

  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function tc(s) { s = Math.round(s); var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
  function court(t) { return String(t || "").replace(/^S\d\d\s*·\s*/, "").replace(/\s*·\s*contrat de confiance$/i, ""); }
  function etat(p) { p = (p || "").toLowerCase(); if (p.indexOf("valid") === 0) return ["done", "prête"]; if (p.indexOf("en cours") === 0) return ["now", "en cours"]; if (p.indexOf("retravail") >= 0) return ["now", "à retravailler"]; return ["", "à faire"]; }

  // Ordre de lecture : chaque scène une fois (l'interlude S06 est montré à sa première place)
  var ids = [], seen = {};
  D.ordre.forEach(function (o) { if (!seen[o.id]) { seen[o.id] = 1; ids.push(o.id); } });
  var total = D.ordre.reduce(function (a, o) { return a + S[o.id].duree; }, 0);
  var pretes = ids.filter(function (k) { return etat(S[k].production)[0] === "done"; }).length;

  document.getElementById("titre").textContent = suivi.titre || "Quelle aurait dû être ta vie ?";
  var focus = cur || nxt;
  document.getElementById("status").innerHTML =
    '<span class="now">' + (cur ? "En cours : " : "Prochaine : ") + "<b>" + esc(focus ? focus + " · " + court(S[focus].titre) : "—") + "</b></span>" +
    "<span><b>" + pretes + "</b> scène" + (pretes > 1 ? "s" : "") + " prête" + (pretes > 1 ? "s" : "") + " sur " + ids.length + "</span>" +
    "<span>Durée prévue <b>" + tc(total) + "</b></span>";
  document.getElementById("note").textContent = suivi.note || "";
  document.getElementById("fin").textContent = tc(total);
  document.getElementById("foot").textContent = "Mise à jour le " + D.genere + ".";

  // Bande de navigation, à l'échelle du temps
  document.getElementById("strip").innerHTML = D.ordre.map(function (o, i) {
    var sc = S[o.id], e = etat(sc.production)[0], c = (o.id === focus ? "now" : (e === "done" ? "done" : ""));
    return '<button type="button" class="' + c + '" data-id="' + o.id + '" style="flex-grow:' + sc.duree + '" title="' + esc(o.id + " · " + court(sc.titre) + " · " + tc(sc.duree)) + '" aria-label="' + esc(o.id + " " + court(sc.titre)) + '">' + o.id.replace("S", "") + "</button>";
  }).join("");

  // Les cartes
  document.getElementById("row").innerHTML = ids.map(function (k) {
    var sc = S[k], e = etat(sc.production), isNow = k === focus;
    var dur = k === "S06" ? tc(sc.duree) + " · revient entre les étapes" : "≈ " + tc(sc.duree);
    var voix = sc.voix.lignes.filter(function (l) { return l.type === "voix"; }).map(function (l) { return "<p>" + esc(l.texte) + "</p>"; }).join("");
    return '<article class="scene' + (isNow ? " now" : "") + '" id="c-' + k + '">' +
      '<div class="top"><span>' + k + " · " + dur + '</span><span class="state ' + (isNow && !e[0] ? "now" : e[0]) + '">' + (isNow && !e[0] ? (cur ? "en cours" : "la prochaine") : e[1]) + "</span></div>" +
      "<h2>" + esc(court(sc.titre)) + "</h2>" +
      '<div class="screen"><div class="label">À l\'écran</div><p>' + esc(ecran[k] || "") + "</p></div>" +
      '<div class="voice"><div class="label">Ce que je dis</div>' + (voix || '<p class="none">Pas de voix : l\'image et le son suffisent.</p>') + "</div>" +
      "</article>";
  }).join("");

  var row = document.getElementById("row");
  function go(id) { var el = document.getElementById("c-" + id); if (el) row.scrollTo({ left: el.offsetLeft - row.offsetLeft - parseFloat(getComputedStyle(row).scrollPaddingLeft || 0), behavior: "smooth" }); mark(id); }
  function mark(id) { Array.prototype.forEach.call(document.querySelectorAll(".strip button"), function (b) { b.classList.toggle("on", b.getAttribute("data-id") === id); }); }
  document.getElementById("strip").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) go(b.getAttribute("data-id")); });
  function step(d) { var w = row.querySelector(".scene"); if (w) row.scrollBy({ left: d * (w.getBoundingClientRect().width + 14), behavior: "smooth" }); }
  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });
  if (focus && ids.indexOf(focus) > 0) setTimeout(function () { go(focus); }, 0); else mark(focus);
})();
</script>
