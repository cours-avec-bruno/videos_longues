Mohanty, 2026-2101, 75 ans, pneumonie, Inde", "animation": "Texte tapé, lent", "procede": "", "son": "Une note grave"}, {"id": "S11-P06", "duree": 8, "matiere": "UI", "contenu": "Le portrait (une seule vraie photo, pixelisée depuis S05) est enfin net", "animation": "Dernier cran, lent zoom avant", "procede": "I13", "son": "Musique"}, {"id": "S11-P07", "duree": 7, "matiere": "UI", "contenu": "Le bilan : « A vu le jour (garçon) dans un village, en Inde. A quitté l'école à 11 ans. A été pêcheur. A épousé Preeti. A élevé 2 enfants. A été applaudi au théâtre à 53 ans. A quitté ce monde à 75 ans. »", "animation": "Texte tapé", "procede": "", "son": ""}, {"id": "S11-P08", "duree": 6, "matiere": "3D", "contenu": "L'opérateur figé, la nuit", "animation": "Fixe", "procede": "I18", "son": ""}], "partie": "La fin de la vie", "resume": "74 ans : son petit-fils entre à l'université. Puis le dernier carton, 75 ANS, une seconde de silence, l'acte de décès (pneumonie). Le portrait (la même vraie photo, pixelisée depuis S05) est enfin net. Le bilan en quelques lignes", "fonction": "RÉVÉLER", "procede": "I13 (payoff) : on ne connaît vraiment quelqu'un qu'à la fin", "secondaires": "T01, S01", "duree_sb": "0:45", "fabrication": "Remotion + photo", "voix": {"lignes": [{"type": "ecran", "texte": "Le fils de Pradeep a obtenu une place à l'université."}, {"type": "voix", "texte": "Il lui glisse un peu d'argent dans la main."}, {"type": "voix", "texte": "L'année d'après, Usha achète un logement. Il en fait le tour, longtemps."}, {"type": "ecran", "texte": "75 ANS"}, {"type": "jeu", "texte": "une seconde de silence total"}, {"type": "ecran", "texte": "À 75 ans, votre vie a pris fin (pneumonie ou autre infection respiratoire basse)."}, {"type": "jeu", "texte": "le portrait devient net ; pas de voix"}, {"type": "ecran", "texte": "A vu le jour (garçon) dans un village, en Inde. A quitté l'école à 11 ans. A été pêcheur. A épousé Preeti. A élevé 2 enfants. A été applaudi au théâtre à 53 ans. A quitté ce monde à 75 ans."}], "mots": 21}, "duree": 45}, "S12": {"id": "S12", "titre": "S12 · Respiration", "duree_fiche": "≈ 0:20", "statut": "à valider (proposition de storyboard)", "production": "à faire", "intention": "La nuit dans le bureau, l'écran affiche l'acte, l'opérateur immobile. Puis le noir : on sort de la simulation.", "plans": [{"id": "S12-P01", "duree": 15, "matiere": "3D", "contenu": "Plan large fixe, la nuit : l'écran est la seule source de lumière, aucune voix", "animation": "Fixe (la lumière de l'écran respire)", "procede": "M05, I18", "son": "Musique seule"}, {"id": "S12-P02", "duree": 5, "matiere": "NOIR", "contenu": "Noir : on sort de la simulation", "animation": "Coupe franche", "procede": "T03", "son": "Queue de musique"}], "partie": "Respiration", "resume": "La nuit dans le bureau. L'écran affiche l'acte de décès, l'opérateur ne bouge plus. 15 s sans voix, puis une coupe au noir", "fonction": "RESPIRER", "procede": "M05 : laisser décanter, comme le demande le concept", "secondaires": "T03", "duree_sb": "0:20", "fabrication": "Blender", "voix": {"lignes": [{"type": "jeu", "texte": "quinze secondes sans voix ; la nuit, l'écran est la seule lumière ; puis le noir"}], "mots": 0}, "duree": 20}, "S13": {"id": "S13", "titre": "S13 · L'aveu", "duree_fiche": "≈ 0:50", "statut": "à valider (ajoutée le 06/11/2026, après la décision de Bruno sur la règle secrète)", "production": "à faire", "intention": "Le twist de la vidéo. Depuis S02, le spectateur croit jouer. L'opérateur avoue : il a toujours pris l'option la plus fréquente, et même la naissance était la plus probable. La vie qu'on vient de suivre n'a jamais été choisie : c'est celle qu'il « aurait dû » vivre.\n\nTrois idées, dans cet ordre, sans en rajouter :\n1. Rien n'était choisi : « Pas même son pays : l'Inde, là où naissent le plus de bébés. Un village, comme la plupart. À chaque carrefour, le chemin le plus fréquenté. » La rafale des écrans le prouve. Le paradoxe, gardé pour S14 : même cette naissance, la plus probable, ne concerne qu'environ 1 bébé sur 200.\n2. Le bon choix ne suffit pas toujours : « À onze ans, je crois que j'ai choisi ce que vous auriez choisi : l'école. Il n'y avait pas l'argent. » Puis, à l'écran : « ingénieur ».\n3. La nuance, honnête : ses choix ont compté (la même naissance, jouée une fois « pour réussir », donne un professeur, avec une part de chance). Et : « Personne ne lui a interdit l'université. En soixante-quinze ans, la question ne lui a pas été posée une seule fois. »\n\nOn est sorti de la simulation (le noir de S12) : la scène est en serif, sauf la rafale (archives de la simulation, en monospace). Ton : une confidence, sans effet de surprise appuyé.", "plans": [{"id": "S13-P01", "duree": 4, "matiere": "MD", "contenu": "« Je vous dois un aveu. » en serif, sur noir", "animation": "Apparition lente", "procede": "H02", "son": "Voix"}, {"id": "S13-P02", "duree": 8, "matiere": "3D", "contenu": "Le bureau la nuit, l'acte de décès encore à l'écran. Voix : « Je n'ai rien choisi pour lui. Pas même son pays. »", "animation": "Fixe", "procede": "N02", "son": "Voix, ambiance"}, {"id": "S13-P03", "duree": 12, "matiere": "UI", "contenu": "La rafale : la carte des naissances (S04), puis toutes les décisions de sa vie, de plus en plus vite ; sur chacune, l'option prise s'allume. Aucun pourcentage à l'écran (décision de Bruno, 07/11/2026) : c'est la voix qui dit la règle", "animation": "Coupes de plus en plus rapides", "procede": "M03, N02", "son": "Un clic par décision, qui s'accélère"}, {"id": "S13-P04", "duree": 6, "matiere": "MD", "contenu": "« L'Inde, un village, un garçon : chaque fois, ce qui arrive le plus souvent. »", "animation": "Apparition", "procede": "N02", "son": "Voix"}, {"id": "S13-P05", "duree": 7, "matiere": "MD", "contenu": "« La seule fois où j'ai choisi comme vous, à 11 ans, ça n'a pas suffi. » L'encart des 11 ans réapparaît (97 %), puis la ligne « … vous avez dû renoncer »", "animation": "Fondu de l'encart", "procede": "N02", "son": "Voix, note tenue"}, {"id": "S13-P06", "duree": 5, "matiere": "UI", "contenu": "« … vous répondiez toujours : ingénieur. » (la ligne de S07)", "animation": "Texte tapé", "procede": "", "son": "Silence"}, {"id": "S13-P07", "duree": 8, "matiere": "UI", "contenu": "Les 75 ans de questions défilent en colonne, sans le mot « université » ; puis, tout en bas, la seule ligne où il apparaît (74 ans, le petit-fils)", "animation": "Défilement lent, la dernière ligne reste", "procede": "", "son": "Voix : « Personne ne lui a interdit l'université… »"}], "partie": "L'aveu", "resume": "Après le noir, en serif. « Je vous dois un aveu. » La rafale de toutes les décisions de sa vie, avec l'option prise, sans aucun pourcentage. « Je n'ai rien choisi pour lui. Pas même son pays : l'Inde, là où naissent le plus de bébés. Un village, comme la plupart. À chaque carrefour, le chemin le plus fréquenté. » Puis : « La seule fois où j'ai choisi comme vous, à 11 ans, ça n'a pas suffi. » Et la nuance : ses choix ont compté (la variante ambitieuse), mais « personne ne lui a interdit l'université ; en soixante-quinze ans, la question ne lui a pas été posée une seule fois ». À 8 ans, il voulait être ingénieur", "fonction": "RÉVÉLER", "procede": "N02 : le comportement du spectateur pendant la vidéo (jouer, croire choisir) devient la réponse. On surestime la part qu'on choisit", "secondaires": "M03 (la rafale des écrans), H02", "duree_sb": "0:50", "fabrication": "Remotion + Blender", "voix": {"lignes": [{"type": "jeu", "texte": "sur noir, en serif ; plus de musique ; la voix plus basse et plus lente, comme quelqu'un qui aurait préféré ne pas avoir à le dire"}, {"type": "voix", "texte": "Je vous dois quelque chose."}, {"type": "voix", "texte": "Je n'ai rien choisi pour lui. À chaque question, j'ai pris la réponse que donnaient le plus souvent deux cents garçons nés comme lui."}, {"type": "jeu", "texte": "la rafale : toutes les décisions de sa vie, de plus en plus vite, avec l'option prise ; aucun pourcentage à l'écran"}, {"type": "voix", "texte": "Sa naissance aussi, je l'ai prise au plus probable. L'Inde, un village, un garçon : chaque fois, ce qui arrive le plus souvent."}, {"type": "voix", "texte": "Vous avez joué. Vous avez essayé de faire au mieux pour lui, et rien ne vous a semblé bizarre."}, {"type": "voix", "texte": "À onze ans, je crois que j'ai choisi ce que vous auriez choisi : l'école. Il n'y avait pas l'argent."}, {"type": "ecran", "texte": "… vous répondiez toujours : ingénieur."}, {"type": "jeu", "texte": "un temps"}, {"type": "voix", "texte": "Ses choix ont compté quand même. J'ai rejoué le même départ, une fois, en prenant chaque fois l'option la plus ambitieuse. Cette fois-là, l'argent de l'école ne lui a pas manqué, et il est devenu professeur. Il est mort à quatre-vingt-neuf ans. La chance y est pour beaucoup, une partie ne prouve rien, mais d'autres chemins existaient."}, {"type": "jeu", "texte": "À CONFIRMER avant l'enregistrement : la variante « ambitieuse » sur beaucoup de vies, /simulate en ambitious contre auto. Si l'écart ne tient pas, on coupe ce paragraphe."}, {"type": "voix", "texte": "Personne ne lui a interdit l'université. En soixante-quinze ans, la question ne lui a pas été posée une seule fois. Le mot n'apparaît qu'une fois dans toute sa vie, l'année avant sa mort, quand son petit-fils y entre."}, {"type": "jeu", "texte": "silence"}], "mots": 184}, "duree": 50}, "S14": {"id": "S14", "titre": "S14 · Et nous ? Naître en France", "duree_fiche": "≈ 1:00", "statut": "à valider (proposition de storyboard)", "production": "à faire", "intention": "Payoff du plant de S03. Passage en serif (hors simulation). Distinguer naître sur le territoire et avoir la nationalité. Source à l'écran (ONU WPP 2024, via 1in8b.life).", "plans": [{"id": "S14-P01", "duree": 4, "matiere": "MD", "contenu": "« Et nous ? » en serif sur noir", "animation": "Apparition", "procede": "H02", "son": "Voix"}, {"id": "S14-P02", "duree": 8, "matiere": <script>
(function () {
  "use strict";
  var raw = document.getElementById("donnees").textContent;
  var D = null;
  try { D = JSON.parse(raw); } catch (e) { D = null; }
  if (!D) { document.getElementById("detail").innerHTML = '<p class="empty">Données absentes : la page doit être générée par shared/outils/timeline/generer.py.</p>'; return; }

  var MAT = { "3D": "--m3d", "UI": "--mui", "MD": "--mmd", "IMG": "--mimg", "NOIR": "--mnoir" };
  var MATNOM = { "3D": "3D (Blender, animée par Higgsfield)", "UI": "Interface", "MD": "Motion design", "IMG": "Photo", "NOIR": "Noir" };
  var ZOOMS = [3, 5, 8, 12, 18];
  var zi = 2;
  try { var zs = localStorage.getItem("tl-zoom"); if (zs !== null && ZOOMS[+zs]) zi = +zs; } catch (e) {}
  var S = D.scenes, ordre = D.ordre, suivi = D.suivi;
  var courante = suivi.en_cours || null, prochaine = suivi.prochaine || null;
  var sel = courante || prochaine || (ordre[0] && ordre[0].id);

  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function tc(s) { s = Math.round(s); var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function varc(n) { return "var(" + n + ")"; }
  function prodCls(p) { p = (p || "").toLowerCase(); if (p.indexOf("valid") === 0) return "validee"; if (p.indexOf("en cours") === 0) return "en-cours"; if (p.indexOf("retravail") >= 0) return "retravailler"; return "a-faire"; }
  function court(t) { return String(t || "").replace(/^S\d\d\s*·\s*/, ""); }

  // Positions de chaque bloc dans le temps
  var pos = [], t = 0;
  ordre.forEach(function (o) { var sc = S[o.id]; pos.push({ o: o, sc: sc, t0: t }); t += sc.duree; });
  var TOTAL = t;

  // En-tête
  document.getElementById("meta").textContent = "Suivi de production · généré le " + D.genere;
  document.getElementById("steps").innerHTML = suivi.etapes.map(function (e) {
    var c = e.etat === "fait" ? "fait" : (e.etat === "en cours" ? "en-cours" : "");
    var extra = "";
    if (e.etat === "en cours" && /scènes/i.test(e.nom)) {
      var ids = Object.keys(S), v = ids.filter(function (k) { return prodCls(S[k].production) === "validee"; }).length;
      extra = ' <span class="mono" style="color:var(--muted)">' + v + "/" + ids.length + "</span>";
    }
    return '<li class="' + c + '">' + esc(e.nom) + extra + "</li>";
  }).join("");
  document.getElementById("apply").innerHTML = (suivi.a_appliquer || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
  document.getElementById("decide").innerHTML = (suivi.a_decider || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");

  // Résumé
  var mots = 0, nplans = 0, parMat = {};
  Object.keys(S).forEach(function (k) {
    var sc = S[k], rep = k === "S06" ? Math.max(1, D.interludes) : 1;
    mots += sc.voix.mots;
    sc.plans.forEach(function (p) { nplans++; parMat[p.matiere] = (parMat[p.matiere] || 0) + p.duree * rep; });
  });
  var ids = Object.keys(S);
  var counts = { "a-faire": 0, "en-cours": 0, "retravailler": 0, "validee": 0 };
  ids.forEach(function (k) { counts[prodCls(S[k].production)]++; });
  var matTot = Object.keys(parMat).reduce(function (a, k) { return a + parMat[k]; }, 0) || 1;
  var nowId = courante || prochaine;
  var nowSc = nowId ? S[nowId] : null;
  document.getElementById("summary").innerHTML =
    '<div class="tile now"><span class="eyebrow">' + (courante ? "En cours" : "Prochaine scène") + '</span><span class="val">' + (nowSc ? esc(nowId + " · " + court(nowSc.titre)) : "—") + '</span><span class="sub">' + (nowSc ? esc(nowSc.fabrication || "") : "") + "</span></div>" +
    '<div class="tile"><span class="eyebrow">Image</span><span class="val">' + tc(TOTAL) + '</span><span class="sub">somme des plans · cible ≈ 10:00</span></div>' +
    '<div class="tile"><span class="eyebrow">Voix off</span><span class="val">' + tc(mots / 130 * 60) + '</span><span class="sub">' + mots + " mots, débit lent (130 / min)</span></div>" +
    '<div class="tile"><span class="eyebrow">Plans</span><span class="val">' + nplans + '</span><div class="mixbar" aria-hidden="true">' +
      Object.keys(MAT).filter(function (k) { return parMat[k]; }).map(function (k) { return '<span style="width:' + (parMat[k] / matTot * 100).toFixed(1) + "%;background:" + varc(MAT[k]) + '" title="' + esc(MATNOM[k]) + " " + Math.round(parMat[k] / matTot * 100) + ' %"></span>'; }).join("") +
    '</div><span class="sub">' + Object.keys(MAT).filter(function (k) { return parMat[k]; }).map(function (k) { return k + " " + Math.round(parMat[k] / matTot * 100) + " %"; }).join(" · ") + "</span></div>" +
    '<div class="tile"><span class="eyebrow">Scènes</span><span class="val">' + counts.validee + " / " + ids.length + '</span><span class="sub">validées · ' + counts["en-cours"] + " en cours · " + counts.retravailler + " à retravailler</span></div>";

  // Légendes
  document.getElementById("legend").innerHTML = Object.keys(MAT).map(function (k) { return '<span><i style="background:' + varc(MAT[k]) + '"></i>' + esc(MATNOM[k]) + "</span>"; }).join("");
  document.getElementById("legend2").innerHTML = [["--todo", "à faire"], ["--accent", "en cours"], ["--redo", "à retravailler"], ["--ok", "validée"]].map(function (x) { return '<span><i style="background:' + varc(x[0]) + '"></i>' + x[1] + "</span>"; }).join("");

  var box = document.getElementById("tlbox"), tl = document.getElementById("tl");

  function render() {
    var px = ZOOMS[zi], L = 84, W = L + TOTAL * px + 24;
    document.getElementById("zlabel").textContent = px + " px / s";
    var h = [];
    // Règle
    var step = px >= 12 ? 10 : (px >= 5 ? 30 : 60);
    h.push('<div class="lane ruler" style="width:' + W + 'px"><div class="name">Temps</div>');
    for (var s = 0; s <= TOTAL; s += step) {
      var major = s % 60 === 0 || step >= 30;
      h.push('<div class="tick' + (major ? "" : " minor") + '" style="left:' + (L + s * px) + 'px">' + tc(s) + "</div>");
    }
    h.push("</div>");
    // Scènes
    h.push('<div class="lane" style="width:' + W + 'px;height:74px"><div class="name">Scènes</div>');
    pos.forEach(function (b) {
      var sc = b.sc, inter = b.o.id === "S06";
      var label = inter ? "Interlude " + b.o.occurrence : court(sc.titre);
      h.push('<button type="button" class="blk p-' + prodCls(sc.production) + (b.o.id === sel ? " sel" : "") + (inter ? " inter" : "") + '" data-id="' + b.o.id + '" style="left:' + (L + b.t0 * px) + "px;width:" + Math.max(3, sc.duree * px - 2) + 'px" title="' + esc(b.o.id + " · " + court(sc.titre) + " · " + tc(sc.duree) + " · " + sc.production) + '"><span class="sid">' + b.o.id + " · " + tc(b.t0) + '</span><span class="ttl">' + esc(label) + "</span></button>");
    });
    h.push("</div>");
    // Plans
    h.push('<div class="lane" style="width:' + W + 'px;height:40px"><div class="name">Plans</div>');
    pos.forEach(function (b) {
      var x = b.t0;
      b.sc.plans.forEach(function (p) {
        h.push('<div class="plan" style="left:' + (L + x * px) + "px;width:" + Math.max(2, p.duree * px) + "px;background:" + varc(MAT[p.matiere] || "--mmd") + '" title="' + esc(p.id + " · " + p.duree + " s · " + p.matiere + " · " + p.contenu) + '"></div>');
        x += p.duree;
      });
    });
    h.push("</div>");
    // Voix
    h.push('<div class="lane" style="width:' + W + 'px;height:46px"><div class="name">Voix</div>');
    pos.forEach(function (b) {
      if (b.o.id === "S06" && b.o.occurrence > 1) return;
      var v = b.sc.voix, lignes = v.lignes.filter(function (l) { return l.type === "voix"; });
      if (!lignes.length) return;
      var d = Math.min(b.sc.duree, Math.max(2, v.mots / 130 * 60));
      h.push('<div class="voice" style="left:' + (L + b.t0 * px) + "px;width:" + Math.max(6, d * px - 2) + 'px" title="' + esc(lignes.map(function (l) { return l.texte; }).join(" ")) + '">' + esc(lignes[0].texte) + "</div>");
    });
    h.push("</div>");
    // Son
    h.push('<div class="lane" style="width:' + W + 'px;height:38px"><div class="name">Son</div>');
    pos.forEach(function (b) {
      var x = b.t0;
      b.sc.plans.forEach(function (p) {
        if (p.son) h.push('<div class="sound" style="left:' + (L + x * px) + "px;width:" + Math.max(2, p.duree * px - 2) + 'px" title="' + esc(p.id + " · " + p.son) + '">' + esc(p.son) + "</div>");
        x += p.duree;
      });
    });
    h.push("</div>");
    // Tête de lecture
    var phId = courante || prochaine;
    var ph = pos.filter(function (b) { return b.o.id === phId; })[0];
    if (ph) h.push('<div class="playhead" style="left:' + (L + ph.t0 * px) + 'px"><b>' + (courante ? "en cours" : "prochaine") + "</b></div>");
    tl.style.width = W + "px";
    tl.innerHTML = h.join("");
  }

  function renderDetail() {
    var sc = S[sel]; if (!sc) return;
    var pc = prodCls(sc.production);
    var plans = sc.plans.map(function (p) {
      return "<tr><td class=\"mono\">" + esc(p.id.replace(/^S\d\d-/, "")) + '</td><td class="mono">' + p.duree + ' s</td><td><span class="mat" style="background:' + varc(MAT[p.matiere] || "--mmd") + '">' + esc(p.matiere) + "</span></td><td>" + esc(p.contenu) + (p.animation ? '<div class="proc">' + esc(p.animation) + "</div>" : "") + "</td><td>" + esc(p.son) + "</td></tr>";
    }).join("");
    var lignes = sc.voix.lignes.map(function (l) { return '<div class="' + l.type + '">' + esc(l.texte) + "</div>"; }).join("");
    document.getElementById("detail").innerHTML =
      '<div class="dhead"><div class="eyebrow">' + esc(sel) + (sel === "S06" ? " · revient " + D.interludes + " fois" : "") + " · " + esc(sc.partie || "") + "</div><h2>" + esc(court(sc.titre)) + '</h2><div class="chips">' +
        '<span class="chip st-' + pc + '">' + esc(sc.production) + "</span>" +
        '<span class="chip">' + tc(sc.duree) + "</span>" +
        (sc.fonction ? '<span class="chip">' + esc(sc.fonction) + "</span>" : "") +
        (sc.fabrication ? '<span class="chip">' + esc(sc.fabrication) + "</span>" : "") +
      "</div></div>" +
      '<div class="cols"><div class="card"><h3>Intention</h3><p>' + esc(sc.intention || sc.resume || "") + '</p>' +
        (sc.procede ? '<div class="proc"><b>Procédé principal</b> · ' + esc(sc.procede) + (sc.secondaires && sc.secondaires !== "—" ? " · secondaires : " + esc(sc.secondaires) : "") + "</div>" : "") +
        '<h3>Plans</h3><div class="tablebox"><table><thead><tr><th>Plan</th><th>Durée</th><th>Matière</th><th>Contenu</th><th>Son</th></tr></thead><tbody>' + (plans || '<tr><td colspan="5" class="empty">Pas encore de plans.</td></tr>') + "</tbody></table></div></div>" +
      '<div class="card"><h3>Script</h3><div class="script">' + (lignes || '<p class="empty">Pas de voix dans cette scène.</p>') + "</div>" +
        '<div class="proc mono">' + sc.voix.mots + " mots · ≈ " + tc(sc.voix.mots / 130 * 60) + " de voix</div></div></div>";
  }

  function select(id, scroll) {
    sel = id; render(); renderDetail();
    if (scroll) { var d = document.getElementById("detail"); if (d.scrollIntoView) d.scrollIntoView({ block: "start", behavior: "smooth" }); }
  }

  tl.addEventListener("click", function (e) { var b = e.target.closest("button.blk"); if (b) select(b.getAttribute("data-id"), window.innerWidth < 860); });
  document.getElementById("zin").addEventListener("click", function () { if (zi < ZOOMS.length - 1) { zi++; save(); render(); } });
  document.getElementById("zout").addEventListener("click", function () { if (zi > 0) { zi--; save(); render(); } });
  document.getElementById("gonow").addEventListener("click", function () {
    var id = courante || prochaine; var b = pos.filter(function (x) { return x.o.id === id; })[0];
    if (b) { box.scrollLeft = Math.max(0, 84 + b.t0 * ZOOMS[zi] - 120); select(id, false); }
  });
  function save() { try { localStorage.setItem("tl-zoom", String(zi)); } catch (e) {} }

  render(); renderDetail();
})();
</script>
